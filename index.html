<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE ✳ ORIGINAL & FANART</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    /* ==========================================================================
       RESET & BASE STYLES (Monochrome Minimal)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-main: #09090b;
      --bg-surface: #121215;
      --bg-surface-hover: #1c1c21;
      --border-color: #27272a;
      --border-light: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent-white: #ffffff;
      
      --font-serif-en: 'Cormorant Garamond', Georgia, serif;
      --font-serif-jp: 'Noto Serif JP', "Hiragino Mincho ProN", serif;
      
      --sidebar-width: 300px;
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-serif-jp);
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.03em;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-light);
    }

    /* ==========================================================================
       LAYOUT: SIDEBAR (Left)
       ========================================================================== */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: var(--bg-main);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 2rem;
      z-index: 100;
      overflow-y: auto;
    }

    .site-brand {
      margin-bottom: 2rem;
    }

    .site-title {
      font-family: var(--font-serif-en);
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      line-height: 1.1;
      color: var(--accent-white);
      display: block;
    }

    .site-title span {
      font-size: 1.2rem;
      vertical-align: super;
      margin-left: 2px;
      color: var(--text-muted);
    }

    .site-subtitle {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-top: 0.5rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1.25rem;
    }

      letter-spacing: 0.15em;
      color: var(--text-muted);
