<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE ✳ ORIGINAL & FANART</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & BASE STYLES (Monochrome Minimal)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-main: #09090b;
      --bg-surface: #121215;
      --bg-surface-hover: #1c1c21;
      --border-color: #27272a;
      --border-light: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent-white: #ffffff;
      
      --font-serif-en: 'Cormorant Garamond', Georgia, serif;
      --font-serif-jp: 'Noto Serif JP', "Hiragino Mincho ProN", serif;
      
      --sidebar-width: 300px;
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-serif-jp);
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.03em;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-light);
    }

    /* Mobile Header & Hamburger Trigger */
    .mobile-header {
      display: none;
    }

    /* ==========================================================================
       LAYOUT: SIDEBAR (Left)
       ========================================================================== */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: var(--bg-main);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 2rem;
      z-index: 100;
      overflow-y: auto;
      transition: var(--transition-smooth);
    }

    .site-brand {
      margin-bottom: 2rem;
    }

    .site-title {
      font-family: var(--font-serif-en);
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      line-height: 1.1;
      color: var(--accent-white);
      display: block;
    }

    .site-title span {
      font-size: 1.2rem;
      vertical-align: super;
      margin-left: 2px;
      color: var(--text-muted);
    }

    .site-subtitle {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-top: 0.5rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1.25rem;
    }

    .admin-trigger-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-serif-en);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      width: 100%;
      transition: var(--transition-smooth);
    }
    .admin-trigger-top:hover {
      color: var(--accent-white);
      border-color: var(--border-light);
      background-color: var(--bg-surface-hover);
    }

    .nav-section {
      margin-bottom: 2rem;
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1rem;
    }

    .nav-header-title {
      font-family: var(--font-serif-en);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .toggle-btn {
      font-size: 0.7rem;
      color: var(--text-dim);
      padding: 2px 6px;
      transition: var(--transition-smooth);
    }
    .toggle-btn:hover {
      color: var(--accent-white);
    }

    .world-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      padding-right: 5px;
    }

    .world-list.collapsed {
      max-height: 0 !important;
      opacity: 0;
      overflow: hidden;
    }

    .world-item {
      margin-bottom: 0.3rem;
    }

    .world-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 2px solid transparent;
    }

    .world-link:hover, .world-link.active {
      color: var(--accent-white);
      border-left-color: var(--accent-white);
      background-color: var(--bg-surface);
    }

    .world-count {
      font-family: var(--font-serif-en);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .nav-menu {
      list-style: none;
    }

    .nav-menu-item {
      margin-bottom: 0.5rem;
    }

    .nav-menu-link {
      display: block;
      font-family: var(--font-serif-en);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.4rem 0;
      border-bottom: 1px solid transparent;
    }

    .nav-menu-link:hover, .nav-menu-link.active {
      color: var(--accent-white);
    }

    .sidebar-footer {
      font-size: 0.75rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 90;
    }

    /* ==========================================================================
       LAYOUT: MAIN CONTENT AREA
       ========================================================================== */
    .main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-height: 100vh;
      padding: 4rem 5rem;
      max-width: 1300px;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    .section-category {
      font-family: var(--font-serif-en);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.5rem;
    }

    .section-title {
      font-family: var(--font-serif-en);
      font-size: 3rem;
      font-weight: 300;
      color: var(--accent-white);
      line-height: 1.1;
    }

    .section-desc {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 700px;
    }

    /* ==========================================================================
       COMPONENTS: CHARACTER GRID (大型化プロポーション 1:1.35)
       ========================================================================== */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); /* カードの幅を拡大 */
      gap: 2.5rem;
      margin-top: 2rem;
    }

    .character-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    .character-card:hover {
      border-color: var(--border-light);
      transform: translateY(-4px);
    }

    .character-thumb-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1.35; /* 縦長化で顔・立ち絵を大きく表示 */
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    .character-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center; /* 顔がしっかり映るよう調整 */
      filter: grayscale(30%);
      transition: var(--transition-smooth);
    }

    .character-card:hover .character-thumb {
      filter: grayscale(0%);
      transform: scale(1.05);
    }

    .character-info {
      padding: 1.25rem 1rem;
      text-align: center;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
    }

    .character-name {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--accent-white);
      margin-bottom: 0.2rem;
    }

    .character-ruby {
      font-family: var(--font-serif-en);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* ==========================================================================
       COMPONENTS: FANART MASONRY GRID & TABS
       ========================================================================== */
    .filter-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .filter-btn {
      font-family: var(--font-serif-en);
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      padding: 0.4rem 1rem;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
    }

    .filter-btn:hover {
      color: var(--text-main);
    }

    .filter-btn.active {
      color: var(--accent-white);
      border-color: var(--border-light);
      background-color: var(--bg-surface);
    }

    .masonry-grid {
      columns: 3 260px;
      column-gap: 1.5rem;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: var(--transition-smooth);
    }

    .masonry-item:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
    }

    .masonry-img {
      width: 100%;
      height: auto;
      display: block;
      filter: grayscale(15%);
      transition: var(--transition-smooth);
    }

    .masonry-item:hover .masonry-img {
      filter: grayscale(0%);
    }

    .masonry-caption {
      padding: 0.8rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .masonry-work {
      font-family: var(--font-serif-en);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ==========================================================================
       MODAL SYSTEM (Character Detail & Lightbox)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 2rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background-color: var(--bg-main);
      border: 1px solid var(--border-light);
      width: 100%;
      max-width: 1050px;
      height: 85vh;
      max-height: 850px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      font-size: 1.5rem;
      color: var(--text-dim);
      z-index: 10;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
      transition: var(--transition-smooth);
      background-color: var(--bg-main);
    }

    .modal-close:hover {
      color: var(--accent-white);
      border-color: var(--border-light);
      background-color: var(--bg-surface);
    }

    /* Character Modal Content */
    .chara-modal-body {
      display: grid;
      grid-template-columns: 45% 55%;
      height: 100%;
      width: 100%;
    }

    .chara-visual-area {
      background-color: #000;
      border-right: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .chara-full-img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .chara-info-area {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
    }

    /* Modal Sub-Tabs */
    .chara-tabs {
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .chara-tab-btn {
      font-family: var(--font-serif-en);
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      padding-bottom: 0.75rem;
      position: relative;
      transition: var(--transition-smooth);
    }

    .chara-tab-btn:hover {
      color: var(--text-main);
    }

    .chara-tab-btn.active {
      color: var(--accent-white);
    }

    .chara-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: var(--accent-white);
    }

    .chara-tab-content {
      display: none;
      flex: 1;
    }

    .chara
