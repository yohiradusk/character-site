backend:
  name: git-gateway
  branch: main # お使いのGitHubのメインブランチ名 (main または master)

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "worlds"
    label: "世界観・キャラクター管理"
    folder: "content/worlds"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "世界観ID (英数字)", name: "id", widget: "string" }
      - { label: "世界観名", name: "title", widget: "string" }
      - { label: "世界観の解説・概要", name: "description", widget: "text", required: false }
      - label: "所属キャラクター"
        name: "characters"
        widget: "list"
        fields:
          - { label: "キャラクターID (英数字)", name: "id", widget: "string" }
          - { label: "名前", name: "name", widget: "string" }
          - { label: "ルビ / 英語表記", name: "ruby", widget: "string", required: false }
          - { label: "役割・肩書", name: "role", widget: "string", required: false }
          - { label: "顔アイコン画像", name: "faceImage", widget: "image", required: false }
          - { label: "全身立ち絵画像", name: "fullImage", widget: "image", required: false }
          - { label: "年齢", name: "age", widget: "string", required: false }
          - { label: "身長", name: "height", widget: "string", required: false }
          - { label: "好きなもの", name: "likes", widget: "string", required: false }
          - { label: "嫌いなもの", name: "dislikes", widget: "string", required: false }
          - { label: "台詞・キャッチコピー", name: "quote", widget: "string", required: false }
          - { label: "詳細プロフィール・設定", name: "description", widget: "text", required: false }

  - name: "fanarts"
    label: "ファンアート管理"
    folder: "content/fanarts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "作品名 (カテゴリ用)", name: "work", widget: "string" }
      - { label: "イラスト画像", name: "url", widget: "image" }
      - { label: "タイトル", name: "title", widget: "string" }
